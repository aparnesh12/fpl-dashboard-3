name: Update FPL Data

on:
  schedule:
    # Every 3 hours. GitHub may delay scheduled runs slightly at busy times —
    # that's normal. Adjust the cron expression below to change cadence.
    - cron: '0 */3 * * *'
  workflow_dispatch: {} # adds a manual "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch latest FPL data
        run: python scripts/fetch_data.py

      - name: Commit and push if data changed
        run: |
          git config user.name "fpl-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update FPL data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
